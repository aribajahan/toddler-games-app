kind = "mobile"
previewPath = "/little-playroom/"
title = "Little Playroom"
description = "A calm, playful mobile app for children ages 4 to 8 with a finger-painting canvas, piano play, and memory matching games."
version = "1.0.0"
id = "artifacts/little-playroom"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/little-playroom/" ]
localPort = 20398

[services.development]
run = "pnpm --filter @workspace/little-playroom run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/little-playroom", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/little-playroom", "run", "serve" ]

[services.env]
PORT = "20398"
BASE_PATH = "/little-playroom/"
